<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Стили шахматной доски -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body {
            margin: 0; padding: 0;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; font-family: sans-serif;
            touch-action: none; user-select: none;
        }
        #board { width: 95vw; max-width: 380px; margin: 10px; }
        #status { font-size: 16px; margin-top: 10px; font-weight: bold; color: #4ade80; text-align: center; height: 20px; }
        
        .controls { display: flex; gap: 10px; margin-top: 15px; }
        button { 
            padding: 10px 15px; font-size: 14px; background: #2481cc; color: white; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; 
        }
        button:disabled { background: #555; color: #888; }
        button.active { background: #4ade80; color: #0f172a; box-shadow: 0 0 10px #4ade80; }
    </style>
</head>
<body>
    <!-- Выбор сложности -->
    <div class="controls" id="difficulty-controls">
        <button onclick="setDifficulty(1)" id="btn-easy">Легко</button>
        <button onclick="setDifficulty(2)" id="btn-medium" class="active">Средне</button>
        <button onclick="setDifficulty(3)" id="btn-hard">Сложно</button>
    </div>

    <div id="status">Твой ход (белые)</div>
    <div id="board"></div>
    <button onclick="location.reload()" style="background: #ef4444; margin-top: 15px;">🔄 Начать заново</button>

    <!-- Библиотеки -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Создаем новую игру. Никаких сохранений в память.
        const game = new Chess();
        let board = null;
        let difficulty = 2; // 1 - Легко, 2 - Средне, 3 - Сложно
        let isThinking = false;

        const pieces = {
            'wP': 'https://upload.wikimedia.org/wikipedia/commons/0/04/Chess_plt60.png',
            'wN': 'https://upload.wikimedia.org/wikipedia/commons/2/28/Chess_nlt60.png',
            'wB': 'https://upload.wikimedia.org/wikipedia/commons/9/9b/Chess_blt60.png',
            'wR': 'https://upload.wikimedia.org/wikipedia/commons/5/5c/Chess_rlt60.png',
            'wQ': 'https://upload.wikimedia.org/wikipedia/commons/4/49/Chess_qlt60.png',
            'wK': 'https://upload.wikimedia.org/wikipedia/commons/3/3b/Chess_klt60.png',
            'bP': 'https://upload.wikimedia.org/wikipedia/commons/c/cd/Chess_pdt60.png',
            'bN': 'https://upload.wikimedia.org/wikipedia/commons/f/f1/Chess_ndt60.png',
            'bB': 'https://upload.wikimedia.org/wikipedia/commons/8/81/Chess_bdt60.png',
            'bR': 'https://upload.wikimedia.org/wikipedia/commons/a/a0/Chess_rdt60.png',
            'bQ': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qdt60.png',
            'bK': 'https://upload.wikimedia.org/wikipedia/commons/e/e3/Chess_kdt60.png'
        };

        function setDifficulty(level) {
            difficulty = level;
            document.querySelectorAll('#difficulty-controls button').forEach(b => b.classList.remove('active'));
            if (level === 1) document.getElementById('btn-easy').classList.add('active');
            if (level === 2) document.getElementById('btn-medium').classList.add('active');
            if (level === 3) document.getElementById('btn-hard').classList.add('active');
            tg.HapticFeedback.impactOccurred('light');
        }

        function onDragStart(source, piece) {
            // Запрещаем ходить, если игра окончена, бот думает или это не твоя фигура
            if (game.game_over() || isThinking) return false;
            if (piece.search(/^b/) !== -1) return false;
        }

        function onDrop(source, target) {
            let move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            updateStatus();
            if (!game.game_over()) {
                isThinking = true;
                document.getElementById('status').innerText = 'Бот думает...';
                setTimeout(makeBotMove, 100); // Даем интерфейсу обновиться
            }
        }

        // --- ЛОГИКА ДВИЖКА БОТА ---
        const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        function evaluateBoard(game) {
            let totalEvaluation = 0;
            const board = game.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        let value = pieceValues[piece.type];
                        if (piece.color === 'w') totalEvaluation += value;
                        else totalEvaluation -= value;
                    }
                }
            }
            return totalEvaluation;
        }

        function minimax(game, depth, alpha, beta, isMaximizing) {
            if (depth === 0 || game.game_over()) return evaluateBoard(game);

            const moves = game.moves({ verbose: true });
            if (isMaximizing) {
                let bestVal = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let val = minimax(game, depth - 1, alpha, beta, false);
                    game.undo();
                    bestVal = Math.max(bestVal, val);
                    alpha = Math.max(alpha, bestVal);
                    if (beta <= alpha) break;
                }
                return bestVal;
            } else {
                let bestVal = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let val = minimax(game, depth - 1, alpha, beta, true);
                    game.undo();
                    bestVal = Math.min(bestVal, val);
                    beta = Math.min(beta, bestVal);
                    if (beta <= alpha) break;
                }
                return bestVal;
            }
        }

        function makeBotMove() {
            if (game.game_over()) {
                isThinking = false;
                updateStatus();
                return;
            }

            const moves = game.moves({ verbose: true });
            if (moves.length === 0) {
                isThinking = false;
                return;
            }

            let bestMove = null;

            if (difficulty === 1) {
                // Легкий: случайный ход
                bestMove = moves[Math.floor(Math.random() * moves.length)];
            } else {
                // Средний (глубина 2) и Сложный (глубина 3)
                let depth = difficulty === 2 ? 2 : 3;
                let bestValue = Infinity; // Бот играет за черных, он хочет минимизировать счет

                // Перемешиваем ходы, чтобы при равном счете бот не ходил одинаково
                moves.sort(() => Math.random() - 0.5);

                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let value = minimax(game, depth - 1, -Infinity, Infinity, true);
                    game.undo();
                    if (value < bestValue) {
                        bestValue = value;
                        bestMove = moves[i];
                    }
                }
            }

            if (bestMove) game.move(bestMove);
            
            board.position(game.fen());
            isThinking = false;
            updateStatus();
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (game.in_checkmate()) {
                statusEl.innerText = game.turn() === 'w' ? 'Мат! Победили черные.' : 'Мат! Победили белые!';
                tg.HapticFeedback.notificationOccurred('success');
            } else if (game.in_draw()) {
                statusEl.innerText = 'Ничья!';
            } else {
                statusEl.innerText = game.turn() === 'w' ? 'Твой ход (белые)' : 'Ход бота...';
            }
        }

        const config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            pieceTheme: function(piece) { return pieces[piece]; }
        };
        
        board = Chessboard('board', config);
        $(window).resize(board.resize);
    </script>
</body>
</html>
